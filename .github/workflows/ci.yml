name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_lite:
        description: 'Build a signed macOS Lite package only (no Apple upload or review submission)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.1"
  # Where we expect the sibling CrispASR checkout to live. The Dart pubspec
  # references the Flutter package inside it at `../CrispASR/flutter/crispasr`.
  # Pinned to immutable commits rather than `main` for reproducible builds.
  #
  # These are shared clones that parallel workers rebuild, and the drift
  # is not hypothetical: on 2026-08-01 a `main` pin put the app 13
  # backends behind the engine and broke the build outright when
  # CrispasrSpeakerDB gained a required consent argument (PLAN §15.1a,
  # §15.7). Worse, one of those backends appeared while CrispASR's git
  # HEAD was UNCHANGED — a worker had rebuilt the dylib — so pinning the
  # ref is necessary but not sufficient; it bounds the source, not the
  # artefact.
  #
  # Bumping: update the commit, run `flutter analyze` + the full test suite
  # (backend_dispatch_test is the drift canary), catalogue any new
  # backends or add them to its documented `engineOnly` set, then commit
  # the bump on its own so a regression bisects cleanly.
  CRISPASR_REPO: CrispStrobe/CrispASR
  CRISPASR_REF: cacb2cb1f0bcfb9f8f7d63b0d8ff1798e24fe709
  # CrispEmbed — on-device embeddings. pubspec path: `../CrispEmbed/flutter/crispembed`.
  CRISPEMBED_REPO: CrispStrobe/CrispEmbed
  CRISPEMBED_REF: 40e7b7dd00bb6b1505c9e6ac74bef0c97efef337
  # glint — MP3/AAC/Opus codec suite. pubspec path: `../glint/bindings/dart`.
  GLINT_REPO: CrispStrobe/glint
  # NB glint uses a per-package tag scheme; the bare `vX.Y.Z` tags are a
  # stale legacy series (v0.9.0 still carries Dart package 0.1.0).
  GLINT_REF: 77738f3ed9b15f627196cc5bbd7f6406814ba2fb

jobs:
  analyze-and-test:
    if: inputs.build_lite != true
    name: Analyze + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out CrisperWeaver
        uses: actions/checkout@v5
        with:
          path: repos/CrisperWeaver

      - name: Check out sibling CrispASR (Dart FFI package)
        uses: actions/checkout@v5
        with:
          repository: ${{ env.CRISPASR_REPO }}
          ref: ${{ env.CRISPASR_REF }}
          path: repos/CrispASR

      - name: Check out sibling CrispEmbed (Dart FFI package)
        uses: actions/checkout@v5
        with:
          repository: ${{ env.CRISPEMBED_REPO }}
          ref: ${{ env.CRISPEMBED_REF }}
          path: repos/CrispEmbed

      - name: Check out sibling glint (Dart FFI package)
        uses: actions/checkout@v5
        with:
          repository: ${{ env.GLINT_REPO }}
          ref: ${{ env.GLINT_REF }}
          path: repos/glint

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        working-directory: repos/CrisperWeaver
        run: flutter pub get

      - name: Generate build info (git hash + timestamp)
        working-directory: repos/CrisperWeaver
        run: bash scripts/gen_build_info.sh

      - name: Dart analyze (treat errors as failures only)
        working-directory: repos/CrisperWeaver
        # `flutter analyze` exits non-zero on infos/warnings too. We only want
        # to fail on errors; infos/warnings are surfaced in the log.
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings
          status=$?
          if [ $status -ne 0 ]; then
            echo "::error::flutter analyze reported errors"
            exit $status
          fi

      # Coverage is collected on the ubuntu leg only. `--coverage` adds a
      # VM-service collection pass to every test file, which roughly doubles
      # the suite's wall time; the macOS leg exists to prove the suite passes
      # on macOS, so it stays uninstrumented and fast.
      - name: Tests
        if: matrix.os != 'ubuntu-latest'
        working-directory: repos/CrisperWeaver
        run: flutter test --reporter expanded

      - name: Tests (with coverage)
        if: matrix.os == 'ubuntu-latest'
        working-directory: repos/CrisperWeaver
        run: flutter test --coverage --reporter expanded

      # Two numbers, because one of them is misleading on its own:
      #
      # * "total" is every line lcov saw, including ~3.5k lines of generated
      #   l10n (lib/l10n/generated/*) that no hand-written test will ever
      #   exercise and that regenerate wholesale whenever a string is added.
      # * "adjusted" excludes those, and is the number the floor watches.
      #
      # Screens are near-zero here by design: they are covered by
      # integration_test/gui_flow_test.dart (run uninstrumented in the GUI
      # job) and by the live suites, neither of which feeds this lcov.
      #
      # This step never fails the build — it warns. A coverage floor that can
      # block a merge turns into a floor people route around; one that leaves
      # a visible ::warning:: on the run is enough to notice a real drop.
      - name: Coverage summary
        if: ${{ always() && matrix.os == 'ubuntu-latest' }}
        working-directory: repos/CrisperWeaver
        env:
          # Set 2 points under the measured adjusted total at the time this
          # step was added (25.30% on 2026-09-02). Raise it when the real
          # number climbs; never lower it to make a red run green.
          COVERAGE_FLOOR: "23.3"
        run: |
          python3 - <<'PY'
          import collections, os, sys

          path = 'coverage/lcov.info'
          if not os.path.exists(path):
              print('::warning::no coverage/lcov.info produced — skipping coverage summary')
              sys.exit(0)

          per = collections.defaultdict(lambda: [0, 0])
          cur = None
          with open(path) as fh:
              for line in fh:
                  line = line.strip()
                  if line.startswith('SF:'):
                      cur = line[3:]
                  elif line.startswith('LH:') and cur:
                      per[cur][0] += int(line[3:])
                  elif line.startswith('LF:') and cur:
                      per[cur][1] += int(line[3:])

          GEN = 'lib/l10n/generated/'
          tot_h = sum(h for h, _ in per.values())
          tot_f = sum(f for _, f in per.values())
          adj_h = sum(h for k, (h, _) in per.items() if GEN not in k)
          adj_f = sum(f for k, (_, f) in per.items() if GEN not in k)

          def pct(h, f):
              return (100.0 * h / f) if f else 0.0

          total = pct(tot_h, tot_f)
          adjusted = pct(adj_h, adj_f)

          dirs = collections.defaultdict(lambda: [0, 0])
          for k, (h, f) in per.items():
              parts = k.split('/')
              key = '/'.join(parts[:2]) if len(parts) > 2 else k
              dirs[key][0] += h
              dirs[key][1] += f

          lines = []
          lines.append(f'total    {tot_h}/{tot_f} lines = {total:.2f}%')
          lines.append(f'adjusted {adj_h}/{adj_f} lines = {adjusted:.2f}%  (excludes {GEN})')
          lines.append('')
          lines.append('per-directory:')
          for k in sorted(dirs):
              h, f = dirs[k]
              lines.append(f'  {k:<32} {h:>6}/{f:<6} {pct(h, f):5.1f}%')
          report = '\n'.join(lines)
          print(report)

          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a') as fh:
                  fh.write('## Unit-test line coverage\n\n```\n' + report + '\n```\n')

          floor = float(os.environ.get('COVERAGE_FLOOR', '0'))
          if adjusted < floor:
              print(f'::warning::adjusted line coverage {adjusted:.2f}% is below the '
                    f'{floor:.1f}% floor — a test was likely dropped or a large '
                    f'untested surface was added')
          PY

      - name: Upload coverage (lcov)
        if: ${{ always() && matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-lcov
          path: repos/CrisperWeaver/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  build-macos:
    if: inputs.build_lite != true
    name: Build macOS (.app)
    runs-on: macos-latest
    needs: analyze-and-test
    # CrispASR keeps growing (more backends → a bigger libwhisper.dylib link).
    # An unbounded build OOM-kills the macos-latest runner mid-link (exit 143 /
    # "runner received a shutdown signal"), exactly as release.yml's macOS job
    # hit — release.yml fixed it with --parallel 2 and passes on the same
    # commit. Give the job a hard ceiling so a hung/thrashing link fails fast
    # instead of burning the full 6 h default.
    timeout-minutes: 90
    steps:
      - name: Check out CrisperWeaver
        uses: actions/checkout@v5
        with:
          path: repos/CrisperWeaver

      - name: Check out sibling CrispASR
        uses: actions/checkout@v5
        with:
          repository: ${{ env.CRISPASR_REPO }}
          ref: ${{ env.CRISPASR_REF }}
          path: repos/CrispASR
          submodules: recursive

      - name: Check out sibling CrispEmbed
        uses: actions/checkout@v5
        with:
          repository: ${{ env.CRISPEMBED_REPO }}
          ref: ${{ env.CRISPEMBED_REF }}
          path: repos/CrispEmbed
          # CrispEmbed vendors ggml as a submodule and this job builds it
          # from source, so it needs the same recursive checkout CrispASR and
          # glint already get. Without it cmake stops at "ggml submodule not
          # found". release.yml has had this on every CrispEmbed checkout;
          # ci.yml was the one that did not.
          submodules: recursive

      - name: Check out sibling glint
        uses: actions/checkout@v5
        with:
          repository: ${{ env.GLINT_REPO }}
          ref: ${{ env.GLINT_REF }}
          path: repos/glint
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Cache the CrispASR native build keyed on the sibling commit hash.
      # The cmake/ninja build is the most expensive CI step (~15-30 min);
      # skipping it when the engine hasn't changed saves significant time.
      - name: Get CrispASR commit hash
        id: crispasr-hash
        run: echo "hash=$(git -C repos/CrispASR rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache CrispASR build
        id: cache-crispasr
        uses: actions/cache@v4
        with:
          # The build scripts write to build-flutter-bundle (NOT build/) —
          # the old path cached an empty dir and never hit.
          path: repos/CrispASR/build-flutter-bundle
          key: crispasr-macos-${{ steps.crispasr-hash.outputs.hash }}

      - name: Build CrispASR + Flutter macOS app (one shot via script)
        working-directory: repos/CrisperWeaver
        env:
          CRISPASR_DIR: ${{ github.workspace }}/repos/CrispASR
          # Cap parallelism so the heavy libwhisper.dylib link doesn't run
          # alongside a swarm of other jobs and blow the runner's RAM (exit
          # 143). Mirrors release.yml's `--parallel 2`; build_macos.sh maps
          # JOBS -> `cmake --build -j`.
          JOBS: "2"
        run: bash scripts/build_macos.sh debug

      - name: Upload .app artifact
        uses: actions/upload-artifact@v6
        with:
          name: crisper_weaver-macos-debug
          path: repos/CrisperWeaver/build/macos/Build/Products/Debug/crisper_weaver.app
          if-no-files-found: error
          retention-days: 14

  build-linux:
    if: inputs.build_lite != true
    name: Build Linux desktop
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - name: Check out CrisperWeaver
        uses: actions/checkout@v5
        with:
          path: repos/CrisperWeaver

      - name: Check out sibling CrispASR
        uses: actions/checkout@v5
        with:
          repository: ${{ env.CRISPASR_REPO }}
          ref: ${{ env.CRISPASR_REF }}
          path: repos/CrispASR
          submodules: recursive

      - name: Check out sibling CrispEmbed
        uses: actions/checkout@v5
        with:
          repository: ${{ env.CRISPEMBED_REPO }}
          ref: ${{ env.CRISPEMBED_REF }}
          path: repos/CrispEmbed
          # CrispEmbed vendors ggml as a submodule and this job builds it
          # from source, so it needs the same recursive checkout CrispASR and
          # glint already get. Without it cmake stops at "ggml submodule not
          # found". release.yml has had this on every CrispEmbed checkout;
          # ci.yml was the one that did not.
          submodules: recursive

      - name: Check out sibling glint
        uses: actions/checkout@v5
        with:
          repository: ${{ env.GLINT_REPO }}
          ref: ${{ env.GLINT_REF }}
          path: repos/glint
          submodules: recursive

      - name: Install Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libjsoncpp-dev libglu1-mesa \
            libkeybinder-3.0-dev libayatana-appindicator3-dev \
            xvfb

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable linux desktop
        run: flutter config --enable-linux-desktop

      - name: Get CrispASR commit hash
        id: crispasr-hash
        run: echo "hash=$(git -C repos/CrispASR rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache CrispASR build
        id: cache-crispasr
        uses: actions/cache@v4
        with:
          # Same path fix as the macOS job above.
          path: repos/CrispASR/build-flutter-bundle
          key: crispasr-linux-${{ steps.crispasr-hash.outputs.hash }}

      - name: Build CrispASR + Flutter Linux desktop (one shot via script)
        working-directory: repos/CrisperWeaver
        env:
          CRISPASR_DIR: ${{ github.workspace }}/repos/CrispASR
          # Cap parallelism so the heavy CrispASR compile doesn't get
          # OOM-killed (exit 143) on the runner — same guard the release
          # workflow's macOS job uses (--parallel 2). Unbounded --parallel
          # spawns one g++ per core, each eating GBs on the large TUs.
          JOBS: 2
        run: bash scripts/build_linux.sh debug

      # Issue #35's regressions were all in the assembled application —
      # onboarding's persistence + landing route, the go()-reached screens
      # with no way back, the voice-clone hand-off, the model list's
      # language filter and duplicate rows. Widget tests cannot see any of
      # them (they need the real router, the real ModelService and the real
      # screens together), so they are driven here against the desktop
      # build the step above just produced. No network, no model weights:
      # the suite seeds prefs and sparse files in a temp models dir.
      - name: GUI integration tests (xvfb)
        working-directory: repos/CrisperWeaver
        env:
          # The suite does NOT require the engine — every path it drives
          # degrades quietly when libcrispasr is absent. Pointing at the
          # build tree is free and lets the real engine load, so a crash in
          # the FFI init surfaces here rather than only in manual testing.
          LD_LIBRARY_PATH: ${{ github.workspace }}/repos/CrispASR/build-flutter-bundle/src:${{ github.workspace }}/repos/CrispASR/build-flutter-bundle/ggml/src
        # `flutter test <target> -d linux` reuses the debug desktop build
        # from the step above, so the incremental cost is a relink, not a
        # full build.
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" \
            flutter test integration_test/gui_flow_test.dart -d linux \
            --reporter expanded

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v6
        with:
          name: crisper_weaver-linux-debug
          path: repos/CrisperWeaver/build/linux/x64/debug/bundle
          if-no-files-found: error
          retention-days: 14

  # The Windows runner carries native code of its own (flutter_window.cpp:
  # the `crisperweaver/window_overlay` channel — fullscreen for the live
  # captions board, always-on-top for the subtitle overlay). Before this job
  # it was first compiled by a release tag. The engine is not needed to
  # compile the runner: the crispasr package is pure Dart and resolves
  # libcrispasr at run time, and crispembed only warns without its DLL.
  build-windows:
    if: inputs.build_lite != true
    name: Build Windows desktop (runner, no engine)
    runs-on: windows-latest
    needs: analyze-and-test
    steps:
      - name: Check out CrisperWeaver
        uses: actions/checkout@v5
        with:
          path: repos/CrisperWeaver

      - name: Check out sibling CrispASR (Dart FFI package)
        uses: actions/checkout@v5
        with:
          repository: ${{ env.CRISPASR_REPO }}
          ref: ${{ env.CRISPASR_REF }}
          path: repos/CrispASR

      - name: Check out sibling CrispEmbed (Dart FFI package)
        uses: actions/checkout@v5
        with:
          repository: ${{ env.CRISPEMBED_REPO }}
          ref: ${{ env.CRISPEMBED_REF }}
          path: repos/CrispEmbed

      - name: Check out sibling glint (Dart FFI package)
        uses: actions/checkout@v5
        with:
          repository: ${{ env.GLINT_REPO }}
          ref: ${{ env.GLINT_REF }}
          path: repos/glint

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Windows desktop + pub get
        working-directory: repos/CrisperWeaver
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter pub get

      - name: Generate build info (git hash + timestamp)
        working-directory: repos/CrisperWeaver
        shell: bash
        run: bash scripts/gen_build_info.sh

      - name: Build Windows (debug)
        working-directory: repos/CrisperWeaver
        shell: pwsh
        run: flutter build windows --debug

  build-macos-lite:
    name: Build signed macOS Lite (.pkg)
    if: github.event_name == 'workflow_dispatch' && inputs.build_lite == true
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Check out CrisperWeaver
        uses: actions/checkout@v5
        with:
          path: repos/CrisperWeaver

      - name: Check out sibling CrispASR
        uses: actions/checkout@v5
        with:
          repository: ${{ env.CRISPASR_REPO }}
          ref: ${{ env.CRISPASR_REF }}
          path: repos/CrispASR
          submodules: recursive

      - name: Check out sibling CrispEmbed
        uses: actions/checkout@v5
        with:
          repository: ${{ env.CRISPEMBED_REPO }}
          ref: ${{ env.CRISPEMBED_REF }}
          path: repos/CrispEmbed
          submodules: recursive

      - name: Check out sibling glint
        uses: actions/checkout@v5
        with:
          repository: ${{ env.GLINT_REPO }}
          ref: ${{ env.GLINT_REF }}
          path: repos/glint
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Test Lite policy
        working-directory: repos/CrisperWeaver
        run: |
          flutter pub get
          flutter test --dart-define=CW_FLAVOR=lite test/lite_flavor_test.dart

      - name: Prepare signing tools
        run: |
          python3 -m venv "$RUNNER_TEMP/lite-signing-venv"
          "$RUNNER_TEMP/lite-signing-venv/bin/pip" install --quiet cryptography
          "$RUNNER_TEMP/lite-signing-venv/bin/python" -m unittest discover \
            -s "$GITHUB_WORKSPACE/repos/CrisperWeaver/test" -p 'test_prepare_macos_lite_profile.py'

      - name: Install existing signing credentials
        env:
          MAC_DIST_P12: ${{ secrets.MAC_DIST_P12 }}
          MAC_DIST_P12_PASSWORD: ${{ secrets.MAC_DIST_P12_PASSWORD }}
          MAC_PROFILE_BASE64: ${{ secrets.MAC_PROFILE_BASE64 }}
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          for name in ('MAC_DIST_P12', 'MAC_DIST_P12_PASSWORD', 'MAC_PROFILE_BASE64', 'APPSTORE_API_KEY_P8'):
              if not os.environ.get(name):
                  raise SystemExit(f'Required existing repo secret is missing: {name}')
          key = os.environ['APPSTORE_API_KEY_P8'].strip().encode()
          # Detect PEM input without embedding a complete private-key header
          # literal, which the tracked-file credential scanner flags.
          if not key.startswith(b'-----BEGIN '):
              key = base64.b64decode(key)
          files = {
              'cw-mac-distribution.p12': base64.b64decode(os.environ['MAC_DIST_P12']),
              'cw-source.provisionprofile': base64.b64decode(os.environ['MAC_PROFILE_BASE64']),
              'AuthKey_9RMU3C7422.p8': key,
          }
          for name, data in files.items():
              with os.fdopen(os.open(root / name, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600), 'wb') as file:
                  file.write(data)
          PY
          KEYCHAIN="$RUNNER_TEMP/mac-appstore.keychain-db"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import "$RUNNER_TEMP/cw-mac-distribution.p12" -k "$KEYCHAIN" \
            -P "$MAC_DIST_P12_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productsign: \
            -s -k ci "$KEYCHAIN" >/dev/null
          EXISTING_KEYCHAINS=()
          while IFS= read -r item; do
            item="${item#*\"}"
            item="${item%\"*}"
            if [[ -n "$item" ]]; then EXISTING_KEYCHAINS+=("$item"); fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN" "${EXISTING_KEYCHAINS[@]}"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Prepare Lite profile using existing certificates
        working-directory: repos/CrisperWeaver
        run: |
          "$RUNNER_TEMP/lite-signing-venv/bin/python" scripts/prepare_macos_lite_profile.py \
            --key "$RUNNER_TEMP/AuthKey_9RMU3C7422.p8" \
            --source-profile "$RUNNER_TEMP/cw-source.provisionprofile" \
            --keychain "$RUNNER_TEMP/mac-appstore.keychain-db" \
            --output "$RUNNER_TEMP/CrisperWeaver_Lite.provisionprofile"

      - name: Build, sign and verify Lite package
        working-directory: repos/CrisperWeaver
        env:
          MAC_PROFILE: ${{ runner.temp }}/CrisperWeaver_Lite.provisionprofile
          SIGN_KEYCHAIN: ${{ runner.temp }}/mac-appstore.keychain-db
          JOBS: '2'
          CW_LITE_DOWNLOADS: 'true'
        # Package only: no App Store Connect upload, validation, or review submission.
        run: bash scripts/build_macos_appstore.sh --lite --package-only

      - name: Check installer signature and checksum
        working-directory: repos/CrisperWeaver
        run: |
          pkgutil --check-signature crisper_weaver-lite-macos-appstore.pkg
          shasum -a 256 crisper_weaver-lite-macos-appstore.pkg \
            > crisper_weaver-lite-macos-appstore.pkg.sha256
          {
            echo '## CrisperWeaver Lite'
            echo
            echo "Built source commit: $GITHUB_SHA"
            echo 'Bundle ID: com.crispstrobe.crisperweaver.lite'
            echo 'Signed app and installer verified. No build uploaded to Apple or submitted for review.'
            echo
            cat crisper_weaver-lite-macos-appstore.pkg.sha256
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed Lite package
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: crisperweaver-lite-macos-${{ github.sha }}
          path: |
            repos/CrisperWeaver/crisper_weaver-lite-macos-appstore.pkg
            repos/CrisperWeaver/crisper_weaver-lite-macos-appstore.pkg.sha256
