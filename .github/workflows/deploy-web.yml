# Web build + Vercel deploy. Every push to main (and release tags)
# builds the Flutter web bundle and deploys to
# https://crisperweaver-web.vercel.app — but only when the Vercel
# secrets are set, so the workflow stays green on forks.
#
# Required repo secrets (Settings → Secrets → Actions):
#   VERCEL_TOKEN       — Vercel account token
#   VERCEL_ORG_ID      — from build/web/.vercel/project.json
#   VERCEL_PROJECT_ID  — likewise (project "web")

name: Deploy Web

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Set only when a production deploy actually ran, so the smoke job stays
    # skipped on PRs and on forks without the Vercel secrets — rather than
    # failing red against a URL this run never touched.
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      FLUTTER_VERSION: "3.44.1"
      # Pinned to immutable commits rather than `main` for reproducible builds.
      #
      # These are shared clones that parallel workers rebuild, and the drift
      # is not hypothetical: on 2026-08-01 a `main` pin put the app 13
      # backends behind the engine and broke the build outright when
      # CrispasrSpeakerDB gained a required consent argument (PLAN §15.1a,
      # §15.7). Worse, one of those backends appeared while CrispASR's git
      # HEAD was UNCHANGED — a worker had rebuilt the dylib — so pinning the
      # ref is necessary but not sufficient; it bounds the source, not the
      # artefact.
      #
      # Bumping: update the commit, run `flutter analyze` + the full test suite
      # (backend_dispatch_test is the drift canary), catalogue any new
      # backends or add them to its documented `engineOnly` set, then commit
      # the bump on its own so a regression bisects cleanly.
      CRISPASR_REPO: CrispStrobe/CrispASR
      CRISPASR_REF: 3244be02610f953fd0212e08c7fc3be573d6ad2d
      CRISPEMBED_REPO: CrispStrobe/CrispEmbed
      CRISPEMBED_REF: 40e7b7dd00bb6b1505c9e6ac74bef0c97efef337
      GLINT_REPO: CrispStrobe/glint
      # NB glint uses a per-package tag scheme; the bare `vX.Y.Z` tags are a
      # stale legacy series (v0.9.0 still carries Dart package 0.1.0).
      GLINT_REF: 77738f3ed9b15f627196cc5bbd7f6406814ba2fb

    steps:
      # -- Checkout repos (pubspec references ../CrispASR, ../CrispEmbed, ../glint) --
      - name: Check out CrisperWeaver
        uses: actions/checkout@v5
        with:
          path: repos/CrisperWeaver

      - name: Check out sibling CrispASR (Dart FFI package)
        uses: actions/checkout@v5
        with:
          repository: ${{ env.CRISPASR_REPO }}
          ref: ${{ env.CRISPASR_REF }}
          path: repos/CrispASR

      - name: Check out sibling CrispEmbed (Dart FFI package)
        uses: actions/checkout@v5
        with:
          repository: ${{ env.CRISPEMBED_REPO }}
          ref: ${{ env.CRISPEMBED_REF }}
          path: repos/CrispEmbed

      - name: Check out sibling glint (Dart FFI package)
        uses: actions/checkout@v5
        with:
          repository: ${{ env.GLINT_REPO }}
          ref: ${{ env.GLINT_REF }}
          path: repos/glint

      # -- Flutter SDK -----------------------------------------------------
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # -- Build -----------------------------------------------------------
      - name: Resolve dependencies
        working-directory: repos/CrisperWeaver
        run: flutter pub get

      - name: Generate build info (git hash + timestamp)
        working-directory: repos/CrisperWeaver
        run: bash scripts/gen_build_info.sh

      - name: Build web (release, dart2js)
        working-directory: repos/CrisperWeaver
        run: flutter build web --release --base-href="/"

      - name: Add Vercel SPA-rewrite config
        run: cp repos/CrisperWeaver/vercel.json repos/CrisperWeaver/build/web/vercel.json

      - uses: actions/upload-artifact@v4
        with:
          name: crisperweaver-web
          path: repos/CrisperWeaver/build/web
          retention-days: 14

      # -- Deploy to Vercel ------------------------------------------------
      - name: Deploy to Vercel (production)
        id: deploy
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && env.VERCEL_TOKEN != ''
        run: |
          npm install -g vercel@latest
          vercel deploy repos/CrisperWeaver/build/web --prod --yes --archive=tgz --token="$VERCEL_TOKEN"
          echo "deployed=true" >> "$GITHUB_OUTPUT"

  # A green deploy job only proves Vercel accepted an upload. This proves the
  # production URL actually serves a bundle that boots and paints — the one
  # thing the web build has no other coverage for (the native GUI has the
  # xvfb integration suite; the web PWA had nothing). Shell only: there is no
  # on-device engine on web, so inference belongs to the HF Space, not here.
  smoke:
    name: Smoke-test the live deployment
    needs: build
    if: needs.build.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-e2e/package-lock.json

      - name: Install test dependencies
        working-directory: web-e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: web-e2e
        run: npx playwright install --with-deps chromium

      - name: Run the web smoke test
        working-directory: web-e2e
        env:
          BASE_URL: https://crisperweaver-web.vercel.app
        run: npx playwright test

      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke-artifacts
          path: web-e2e/artifacts
          retention-days: 7
          if-no-files-found: ignore
