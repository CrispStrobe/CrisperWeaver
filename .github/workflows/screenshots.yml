name: App Store Screenshots

# Seeded store screenshots (integration_test/screenshots_test.dart) at exact
# App Store sizes: iPhone 6.9" 1320x2868, iPad 13" 2064x2752, Mac 2880x1800.
# Uploaded as one artifact per flavor. Seeded UI examples; no inference proof.

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Product flavor to capture'
        type: choice
        options: [full, lite]
        default: full
      mac_only:
        description: 'Capture macOS only; skip iOS builds and simulators'
        type: boolean
        default: false
      locales:
        description: 'Space-separated app languages to capture'
        type: string
        default: 'en de'
      macos:
        description: 'Also capture the macOS shots'
        type: boolean
        default: true

env:
  FLUTTER_VERSION: "3.44.1"
  # Keep these three in step with release.yml.
  CRISPASR_REPO: CrispStrobe/CrispASR
  CRISPASR_REF: 52ae1d79217a3684eaab7b3969d4fcef086a342f
  CRISPEMBED_REPO: CrispStrobe/CrispEmbed
  CRISPEMBED_REF: 40e7b7dd00bb6b1505c9e6ac74bef0c97efef337
  GLINT_REPO: CrispStrobe/glint
  GLINT_REF: 77738f3ed9b15f627196cc5bbd7f6406814ba2fb

jobs:
  screenshots:
    # macos-26 for Xcode 26 (device_info_plus needs the iOS 26.1 SDK; see
    # release.yml's iOS job).
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          path: repos/CrisperWeaver

      - uses: actions/checkout@v5
        with:
          repository: ${{ env.CRISPASR_REPO }}
          ref: ${{ env.CRISPASR_REF }}
          path: repos/CrispASR
          submodules: recursive

      - uses: actions/checkout@v5
        with:
          repository: ${{ env.CRISPEMBED_REPO }}
          ref: ${{ env.CRISPEMBED_REF }}
          path: repos/CrispEmbed
          submodules: recursive

      - uses: actions/checkout@v5
        with:
          repository: ${{ env.GLINT_REPO }}
          ref: ${{ env.GLINT_REF }}
          path: repos/glint

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Runner.xcodeproj references ios/Frameworks/crispasr.xcframework; the
      # simulator build fails without it (the Sep 12 runs). Same scripts as
      # the release IPA, which build a simulator slice alongside the device one.
      - name: Build crispasr.xcframework
        if: ${{ !inputs.mac_only }}
        working-directory: repos/CrisperWeaver
        env:
          CRISPASR_DIR: ${{ github.workspace }}/repos/CrispASR
          CRISPEMBED_DIR: ${{ github.workspace }}/repos/CrispEmbed
          IOS_MIN_OS_VERSION: "13.0"
        run: bash scripts/build_ios_xcframework.sh

      - name: Wire crispasr.xcframework
        if: ${{ !inputs.mac_only }}
        working-directory: repos/CrisperWeaver
        run: |
          gem install xcodeproj --no-document
          ruby scripts/wire_ios_xcframework.rb

      - name: Build + wire glint.xcframework
        if: ${{ !inputs.mac_only }}
        working-directory: repos/CrisperWeaver
        env:
          GLINT_DIR: ${{ github.workspace }}/repos/glint
          IOS_MIN_OS_VERSION: "13.0"
        run: |
          bash scripts/build_ios_glint_xcframework.sh
          ruby scripts/wire_ios_glint.rb

      - name: Pub get
        working-directory: repos/CrisperWeaver
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: Build native macOS dependencies and debug app
        if: ${{ inputs.macos || inputs.mac_only }}
        working-directory: repos/CrisperWeaver
        env:
          CRISPASR_DIR: ${{ github.workspace }}/repos/CrispASR
          CRISPEMBED_DIR: ${{ github.workspace }}/repos/CrispEmbed
          GLINT_DIR: ${{ github.workspace }}/repos/glint
          CW_FLAVOR: ${{ inputs.flavor }}
          CW_LITE_DOWNLOADS: "true"
        run: bash scripts/build_macos.sh debug

      - name: Boot simulators
        if: ${{ !inputs.mac_only }}
        run: |
          set -euo pipefail
          pick() {
            for pat in "$@"; do
              udid=$(xcrun simctl list devices available | grep -m1 -E "$pat" | grep -oE "[0-9A-Fa-f-]{36}" || true)
              [ -n "$udid" ] && { echo "$udid"; return 0; }
            done
            return 1
          }
          IPHONE=$(pick "iPhone 1[6-9] Pro Max" "iPhone .*Pro Max")
          IPAD=$(pick "iPad Pro 13-inch" "iPad Pro .*12.9-inch" "iPad Pro")
          echo "iPhone: $IPHONE  iPad: $IPAD"
          xcrun simctl boot "$IPHONE" || true
          xcrun simctl boot "$IPAD" || true
          xcrun simctl bootstatus "$IPHONE" -b
          xcrun simctl bootstatus "$IPAD" -b
          echo "IPHONE_UDID=$IPHONE" >> "$GITHUB_ENV"
          echo "IPAD_UDID=$IPAD" >> "$GITHUB_ENV"

      # Shots are written straight to $OUT (SHOT_HOST_DIR) where the app may;
      # otherwise to its temp dir, which the sweep after each capture collects.
      - name: Capture
        working-directory: repos/CrisperWeaver
        env:
          LOCALES: ${{ inputs.locales }}
          WITH_MACOS: ${{ inputs.macos }}
          MAC_ONLY: ${{ inputs.mac_only }}
          CW_FLAVOR: ${{ inputs.flavor }}
        run: |
          # Not -e (GitHub's default): one failed capture must not stop the rest.
          set +e -u
          OUT="$GITHUB_WORKSPACE/screenshots"
          mkdir -p "$OUT"
          failed=0
          collect() {
            find "$@" -path '*cw-shots*' -name '*.png' 2>/dev/null \
              | while read -r f; do mv "$f" "$OUT/"; done
            return 0
          }
          # A 15-minute watchdog per capture: on iOS the test's output only
          # arrives when it ends, so a hang shows nothing and would otherwise
          # eat the whole job. On timeout, dump the app's own log.
          capture() { # device-id shot-device locale
            flutter test integration_test/screenshots_test.dart -d "$1" \
              --dart-define=SHOT_DEVICE="$2" --dart-define=SHOT_LOCALE="$3" \
              --dart-define=CW_FLAVOR="$CW_FLAVOR" --dart-define=CW_LITE_DOWNLOADS=true \
              --dart-define=SHOT_FLAVOR="$CW_FLAVOR" \
              --dart-define=SHOT_PREFIX="${CW_FLAVOR}_${2}_${3}" --dart-define=SHOT_HOST_DIR="$OUT" &
            local pid=$!
            ( sleep 900; echo "::warning::$2 $3 timed out"; touch /tmp/cw-timeout; kill -TERM $pid ) &
            local dog=$!
            wait $pid || failed=1
            kill $dog 2>/dev/null
            if [ -f /tmp/cw-timeout ]; then
              rm -f /tmp/cw-timeout
              [ "$1" != macos ] && xcrun simctl spawn "$1" log show --last 20m --style compact \
                --predicate 'process == "Runner"' 2>/dev/null | tail -150
            fi
          }
          for loc in $LOCALES; do
            if [ "$MAC_ONLY" != "true" ]; then
              capture "$IPHONE_UDID" iphone "$loc"
              collect ~/Library/Developer/CoreSimulator/Devices
              capture "$IPAD_UDID" ipad "$loc"
              collect ~/Library/Developer/CoreSimulator/Devices
            fi
            if [ "$WITH_MACOS" = "true" ] || [ "$MAC_ONLY" = "true" ]; then
              capture macos mac "$loc"
              collect ~/Library/Containers "${TMPDIR:-/tmp}"
            fi
          done
          ls -l "$OUT"
          for f in "$OUT"/*.png; do
            echo "$(basename "$f"): $(sips -g pixelWidth -g pixelHeight "$f" | awk '/pixel/{printf "%s ", $2}')"
          done
          exit $failed

      - name: Describe screenshot evidence
        if: always()
        env:
          CW_FLAVOR: ${{ inputs.flavor }}
          LOCALES: ${{ inputs.locales }}
          MAC_ONLY: ${{ inputs.mac_only }}
        run: |
          {
            echo "## Store screenshots: $CW_FLAVOR"
            echo "Locales: $LOCALES. macOS only: $MAC_ONLY."
            echo "These are seeded UI examples, with example transcript history and sparse placeholder model files."
            echo "No speech inference is run during capture; these images do not validate model accuracy or inference capability."
            echo "Artifact: app-store-screenshots-$CW_FLAVOR. Filenames include flavor, device and locale."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots-${{ inputs.flavor }}
          path: screenshots/*.png
          if-no-files-found: error
