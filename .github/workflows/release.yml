name: Release

# Triggered by pushing a tag like `v1.2.3`. Builds release artifacts and
# attaches them to the matching GitHub Release. The Release itself is
# auto-created if it doesn't already exist.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0). If omitted, uses the current HEAD."
        required: false
        default: ""

# Single static concurrency group across every release run, including
# different tags. Pushing v0.6.38 while v0.6.37 is still building
# cancels v0.6.37's in-flight jobs — only the newest tag's artefacts
# get attached to GitHub Releases. This matches the rapid-iteration
# workflow where intermediate-tag .app.zip / .apk / .ipa bundles would
# just be wasted runner time; the user only needs the latest.
#
# If you ever need ALL tags' artefacts (e.g. shipping a hotfix branch
# in parallel with main's latest), either rename the group locally
# in a one-off branch or push the older tag once the newer release
# has finished.
concurrency:
  group: release
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.1"
  CRISPASR_REPO: CrispStrobe/CrispASR
  CRISPASR_REF: main
  CRISPEMBED_REPO: CrispStrobe/CrispEmbed
  CRISPEMBED_REF: main

jobs:
  build-macos:
    name: macOS (.app.zip)
    runs-on: macos-latest
    # CrispASR grew large enough (Zonos, TADA-TTS, …) that an unbounded
    # `--parallel` build OOM-killed the 7 GB M1 runner mid-compile (exit 143
    # in v0.7.6). Bound the build below + give the job explicit headroom.
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Check out CrisperWeaver
        uses: actions/checkout@v5
        with:
          path: repos/CrisperWeaver
          ref: ${{ inputs.tag || github.ref }}

      - name: Check out sibling CrispASR
        uses: actions/checkout@v5
        with:
          repository: ${{ env.CRISPASR_REPO }}
          ref: ${{ env.CRISPASR_REF }}
          path: repos/CrispASR
          submodules: recursive

      - name: Check out sibling CrispEmbed
        uses: actions/checkout@v5
        with:
          repository: ${{ env.CRISPEMBED_REPO }}
          ref: ${{ env.CRISPEMBED_REF }}
          path: repos/CrispEmbed
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install espeak-ng (kokoro phonemizer)
        # CMake links libespeak-ng into kokoro when Homebrew has it
        # available (find_path scans /opt/homebrew/include). Without
        # this, kokoro_synthesize falls back to popen("espeak-ng") at
        # runtime — broken on a clean .app handed to a user.
        run: brew install espeak-ng

      - name: Build libwhisper.dylib (Release + Metal)
        working-directory: repos/CrispASR
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON -DWHISPER_METAL=ON \
            -DCRISPASR_OPUS_FETCH=ON
          # --parallel 2 (not unbounded): caps peak RAM so the heavier
          # CrispASR build doesn't get OOM-killed on the 7 GB M1 runner.
          cmake --build build --config Release --parallel 2 --target crispasr-lib
          ls -lh build/src/libwhisper*.dylib

      - name: Pub get
        working-directory: repos/CrisperWeaver
        run: flutter pub get

      - name: Generate build info (git hash + timestamp)
        working-directory: repos/CrisperWeaver
        run: bash scripts/gen_build_info.sh

      - name: Refresh baked models catalogue
        working-directory: repos/CrisperWeaver
        # Re-bake `lib/services/baked_models_catalog.dart` from the live
        # HF API so every release ships with a current snapshot — without
        # this the Models screen would either wait on the live probe at
        # first launch OR show stale catalog entries. ~30 s + 30 HTTP
        # requests; failures don't gate the build (the committed snapshot
        # is the floor).
        run: timeout 120 dart run scripts/bake_models_catalog.dart || true

      - name: Build macOS (Release)
        working-directory: repos/CrisperWeaver
        run: flutter build macos --release

      - name: Bundle all CrispASR dylibs + ad-hoc sign
        working-directory: repos/CrisperWeaver
        run: |
          CRISPASR_DIR="$GITHUB_WORKSPACE/repos/CrispASR" \
            APP=build/macos/Build/Products/Release/crisper_weaver.app \
            ./scripts/bundle_macos_dylibs.sh

      - name: Zip .app
        working-directory: repos/CrisperWeaver/build/macos/Build/Products/Release
        run: |
          ditto -c -k --keepParent crisper_weaver.app crisper_weaver-macos.zip
          shasum -a 256 crisper_weaver-macos.zip | tee crisper_weaver-macos.zip.sha256

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            repos/CrisperWeaver/build/macos/Build/Products/Release/crisper_weaver-macos.zip
            repos/CrisperWeaver/build/macos/Build/Products/Release/crisper_weaver-macos.zip.sha256
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

  build-linux:
    name: Linux (.tar.gz bundle)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out CrisperWeaver
        uses: actions/checkout@v5
        with:
          path: repos/CrisperWeaver
          ref: ${{ inputs.tag || github.ref }}

      - name: Check out sibling CrispASR
        uses: actions/checkout@v5
        with:
          repository: ${{ env.CRISPASR_REPO }}
          ref: ${{ env.CRISPASR_REF }}
          path: repos/CrispASR
          submodules: recursive

      - name: Check out sibling CrispEmbed
        uses: actions/checkout@v5
        with:
          repository: ${{ env.CRISPEMBED_REPO }}
          ref: ${{ env.CRISPEMBED_REF }}
          path: repos/CrispEmbed
          submodules: recursive

      - name: Install Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libjsoncpp-dev libglu1-mesa \
            libkeybinder-3.0-dev libayatana-appindicator3-dev \
            libespeak-ng-dev espeak-ng-data

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build libcrispasr.so (Release, all-in-one)
        working-directory: repos/CrispASR
        run: |
          # Build static with PIC, then re-link as a single shared lib
          # with ggml + all backends baked in. No separate ggml .so's needed.
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCRISPASR_BUILD_EXAMPLES=OFF -DCRISPASR_BUILD_TESTS=OFF \
            -DCRISPASR_OPUS_FETCH=ON
          cmake --build build --config Release --parallel --target crispasr-lib
          cd build
          # -Wl,-rpath,$ORIGIN so libcrispasr.so finds its sibling
          # libespeak-ng.so.1 in <bundle>/lib/ at dlopen time. Without
          # this, the NEEDED entry from -lespeak-ng resolves against
          # the system loader only — fine on dev machines with apt
          # espeak-ng installed, broken on a vanilla Linux user who
          # just untars our release.
          gcc -shared -o src/libcrispasr.so \
            -Wl,-rpath,'$ORIGIN' \
            -Wl,--whole-archive \
            src/libcrispasr.a \
            $(find . -name "lib*.a" ! -name "libcrispasr.a" ! -name "libCatch*" ! -name "libcommon*" -printf "%p ") \
            -Wl,--no-whole-archive \
            -lstdc++ -lm -lpthread -fopenmp \
            -lespeak-ng
          ln -sf libcrispasr.so src/libwhisper.so
          ls -lh src/libcrispasr.so
          nm -D src/libcrispasr.so | grep -c "T " | xargs printf "  %d exported symbols\n"
          # Verify opus decode symbols (#26)
          SYMS=$(nm -D src/libcrispasr.so)
          for sym in opus_decode_float opus_decoder_create op_open_file crispasr_audio_load whisper_full; do
            if ! echo "$SYMS" | grep -q "$sym"; then
              echo "::error::libcrispasr.so missing symbol: $sym" >&2
              exit 1
            fi
          done
          echo "  ✓ opus + core symbols verified"

      - name: Enable Linux desktop + pub get
        working-directory: repos/CrisperWeaver
        run: |
          flutter config --enable-linux-desktop
          flutter pub get

      - name: Generate build info (git hash + timestamp)
        working-directory: repos/CrisperWeaver
        run: bash scripts/gen_build_info.sh

      - name: Refresh baked models catalogue
        working-directory: repos/CrisperWeaver
        run: timeout 120 dart run scripts/bake_models_catalog.dart || true

      - name: Build Linux (Release)
        working-directory: repos/CrisperWeaver
        run: flutter build linux --release

      - name: Bundle libcrispasr.so + libespeak-ng into bundle/lib/
        working-directory: repos/CrisperWeaver
        run: |
          BUNDLE=build/linux/x64/release/bundle
          mkdir -p "$BUNDLE/lib"
          # Single self-contained shared lib (ggml + all backends linked in)
          cp ../CrispASR/build/src/libcrispasr.so "$BUNDLE/lib/libwhisper.so"
          ln -sf libwhisper.so "$BUNDLE/lib/libcrispasr.so"
          # Bundle libespeak-ng so kokoro can phonemize on machines that
          # don't have espeak-ng pre-installed. CMake links via NEEDED;
          # if the user system doesn't have it, dlopen fails silently
          # (kokoro stays unusable). Ship the .so and its symlinks.
          ESP=$(dpkg -L libespeak-ng1 2>/dev/null | grep -E 'libespeak-ng\.so' | head -3)
          if [ -n "$ESP" ]; then
            for f in $ESP; do cp -P "$f" "$BUNDLE/lib/" 2>/dev/null || true; done
            ls -lh "$BUNDLE/lib/" | grep espeak || true
          else
            echo "::warning::libespeak-ng package files not found via dpkg -L; kokoro phonemizer will require system espeak-ng" >&2
          fi
          # Bundle espeak-ng-data so libespeak-ng can phonemize without
          # the user installing the data package separately. Mirror the
          # apt path layout — espeak-ng searches relative to its own dir
          # at runtime as well as $ESPEAK_DATA_PATH.
          if [ -d /usr/lib/x86_64-linux-gnu/espeak-ng-data ]; then
            mkdir -p "$BUNDLE/lib/espeak-ng-data"
            cp -R /usr/lib/x86_64-linux-gnu/espeak-ng-data/. "$BUNDLE/lib/espeak-ng-data/"
          elif [ -d /usr/share/espeak-ng-data ]; then
            mkdir -p "$BUNDLE/lib/espeak-ng-data"
            cp -R /usr/share/espeak-ng-data/. "$BUNDLE/lib/espeak-ng-data/"
          else
            echo "::warning::espeak-ng-data not found in standard apt paths" >&2
          fi
          ls -lh "$BUNDLE/lib/libwhisper.so"
          # Verify key symbols are present
          nm -D "$BUNDLE/lib/libwhisper.so" | grep -q ggml_siglu_swapped && echo "OK: ggml_siglu_swapped exported" || echo "WARN: ggml_siglu_swapped missing!"
          nm -D "$BUNDLE/lib/libwhisper.so" | grep -q crispasr_session_available_backends && echo "OK: available_backends exported" || echo "WARN: available_backends missing!"
          # Confirm kokoro's in-process phonemizer landed (means
          # CMake found libespeak-ng at build time).
          if nm -D "$BUNDLE/lib/libwhisper.so" | grep -q kokoro_phonemize_text_lib; then
            echo "OK: kokoro_phonemize_text_lib exported (in-process espeak)"
          else
            echo "WARN: kokoro_phonemize_text_lib missing — kokoro will fall back to popen(espeak-ng)" >&2
          fi

      - name: Tarball
        working-directory: repos/CrisperWeaver/build/linux/x64/release
        run: |
          mv bundle crisper_weaver
          tar -czf crisper_weaver-linux-x64.tar.gz crisper_weaver
          sha256sum crisper_weaver-linux-x64.tar.gz | tee crisper_weaver-linux-x64.tar.gz.sha256

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            repos/CrisperWeaver/build/linux/x64/release/crisper_weaver-linux-x64.tar.gz
            repos/CrisperWeaver/build/linux/x64/release/crisper_weaver-linux-x64.tar.gz.sha256
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

  build-android:
    name: Android APK (real ASR, arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out CrisperWeaver
        uses: actions/checkout@v5
        with:
          path: repos/CrisperWeaver
          ref: ${{ inputs.tag || github.ref }}

      - name: Check out sibling CrispASR
        uses: actions/checkout@v5
        with:
          repository: ${{ env.CRISPASR_REPO }}
          ref: ${{ env.CRISPASR_REF }}
          path: repos/CrispASR

      - name: Check out sibling CrispEmbed
        uses: actions/checkout@v5
        with:
          repository: ${{ env.CRISPEMBED_REPO }}
          ref: ${{ env.CRISPEMBED_REF }}
          path: repos/CrispEmbed

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v4

      - name: Install NDK 26
        run: |
          sdkmanager --install "ndk;26.3.11579264" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Cross-compile espeak-ng for arm64-android. Two-step build:
      #   1. native (host linux-x86_64) — produces the `espeak-ng`
      #      binary that espeak-ng's CMake uses to generate
      #      espeak-ng-data/ (the runtime phoneme tables).
      #   2. arm64-android — static lib for linking into libcrispasr.so.
      # Without this, kokoro on Android can't phonemize → synthesize
      # returns no audio (#6 root cause on Android). Result paths:
      #   $ESPEAK_NG_NATIVE_ROOT  — host install + espeak-ng-data/
      #   $ESPEAK_NG_ANDROID_ROOT — arm64 static .a + headers
      - name: Build espeak-ng for arm64-android (kokoro phonemizer)
        env:
          # `1.52.0` (the latest tag) doesn't have the
          # `if (CMAKE_CROSSCOMPILING) { find_program NATIVEBUILD }`
          # branch needed to pick up the native binary for data
          # generation — it unconditionally invokes
          # $<TARGET_FILE:espeak-ng-bin> in cmake/data.cmake, which
          # is the cross-compiled arm64 binary and fails at build
          # time with "Syntax error: Unterminated quoted string"
          # (it's an ELF, not a shell script). master branch added
          # the cross-compile bypass; pin to a known-good HEAD here.
          ESPEAK_NG_REF: "master"
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config
          git clone --depth=1 --branch "$ESPEAK_NG_REF" \
            https://github.com/espeak-ng/espeak-ng.git espeak-ng-src
          cd espeak-ng-src
          # Step 1 — native build for the data-generation binary.
          # Notes:
          #  * Target is `espeak-ng-bin` (OUTPUT_NAME espeak-ng) —
          #    `--target espeak-ng` matches a phony rule that builds
          #    the data tree only.
          #  * Disable ESPEAK_COMPAT so the install step doesn't try
          #    to copy the speak-ng / espeak / speak compat symlinks
          #    (they're created by a separate ALL custom target that
          #    `--target espeak-ng-bin` doesn't drag in).
          # COMPILE_INTONATIONS=ON (the default) is what produces
          # the espeak-ng-data/ tree we ship as a Flutter asset.
          # ESPEAK_COMPILE_PHONEME_DATA isn't a real option — drop it.
          cmake -S . -B build-native \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DESPEAK_COMPAT=OFF \
            -DUSE_ASYNC=OFF -DUSE_MBROLA=OFF -DUSE_KLATT=OFF \
            -DUSE_LIBPCAUDIO=OFF -DUSE_LIBSONIC=OFF \
            -DENABLE_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/espeak-ng-native"
          # Two-step build: first the executable so it exists, then
          # `data` (the ALL custom target in cmake/data.cmake) which
          # runs espeak-ng to actually compile phontab / phondata /
          # phonindex / *_dict / intonations into share/espeak-ng-data/.
          # Without the `data` step, `cmake --install` only copies the
          # source-controlled lang/ + voices/!v subdirs and the
          # espeak-ng-data we bundle as a Flutter asset is missing all
          # the compiled phoneme tables — kokoro_synthesize then
          # returns no PCM at first call (#6 Android root cause).
          cmake --build build-native --parallel --target espeak-ng-bin
          cmake --build build-native --parallel --target data
          cmake --install build-native
          ESPEAK_NG_NATIVE_ROOT="$GITHUB_WORKSPACE/espeak-ng-native"
          echo "ESPEAK_NG_NATIVE_ROOT=$ESPEAK_NG_NATIVE_ROOT" >> $GITHUB_ENV
          # Step 2 — cross-compile static lib for arm64-android using the
          # native binary for intonations data gen.
          NDK_TC="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          # Cross-build just needs libespeak-ng.a for linking into
          # libcrispasr.so. COMPILE_INTONATIONS=OFF skips the
          # data-regeneration custom commands entirely (we ship the
          # native build's intonations file as part of the Flutter
          # asset bundle, so no need to recreate them here).
          cmake -S . -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_TC" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_NATIVE_API_LEVEL=24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DUSE_ASYNC=OFF -DUSE_MBROLA=OFF -DUSE_KLATT=OFF \
            -DUSE_LIBPCAUDIO=OFF -DUSE_LIBSONIC=OFF \
            -DCOMPILE_INTONATIONS=OFF \
            -DESPEAK_COMPAT=OFF \
            -DENABLE_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/espeak-ng-android"
          cmake --build build-android --parallel
          cmake --install build-android
          ESPEAK_NG_ANDROID_ROOT="$GITHUB_WORKSPACE/espeak-ng-android"
          echo "ESPEAK_NG_ANDROID_ROOT=$ESPEAK_NG_ANDROID_ROOT" >> $GITHUB_ENV
          echo "=== android espeak-ng install layout ==="
          find "$ESPEAK_NG_ANDROID_ROOT" -maxdepth 3 \( -name '*.a' -o -name '*.h' \) | head -20

      # Cross-build a single all-in-one libcrispasr.so for Android arm64.
      # Same approach as Linux: static build with PIC, then re-link as
      # one shared lib with all ggml + backend symbols baked in.
      - name: Cross-build libcrispasr.so for Android arm64 (all-in-one)
        working-directory: repos/CrispASR
        env:
          NDK_TC: ${{ env.ANDROID_NDK_HOME }}/build/cmake/android.toolchain.cmake
        run: |
          # Compute ESPEAK_NG_INCLUDE_DIR + LIBRARY so CrispASR's kokoro
          # CMake snippet (src/CMakeLists.txt around L949-L991) hits the
          # cross-compiled static lib and sets CRISPASR_HAVE_ESPEAK_NG=1.
          ESPEAK_INC=$(find "$ESPEAK_NG_ANDROID_ROOT" -maxdepth 4 -type d -name 'espeak-ng' -path '*/include/*' | head -1)
          ESPEAK_INC="${ESPEAK_INC%/espeak-ng}"
          ESPEAK_LIB=$(find "$ESPEAK_NG_ANDROID_ROOT" -name 'libespeak-ng.a' | head -1)
          # libucd.a holds the ucd_isalpha / ucd_isspace / ucd_toupper /
          # ucd_tolower symbols libespeak-ng calls into. espeak-ng's CMake
          # builds it as a separate static lib in src/ucd-tools/ but
          # `cmake --install` does NOT copy it into the install prefix —
          # so finding it requires looking at the build tree directly.
          # Forgetting this lib was the v0.6.9–0.6.13 Android regression
          # (#6 follow-up): libcrispasr.so had unresolved ucd_* symbols,
          # dlopen silently failed at runtime, the Dart side reported
          # "Available backends: {}" and kokoro session_open threw
          # "cannot locate symbol ucd_isalpha".
          UCD_LIB=$(find "$GITHUB_WORKSPACE/espeak-ng-src/build-android" \
            -name 'libucd.a' 2>/dev/null | head -1)
          if [ -z "$UCD_LIB" ]; then
            # Fallback: maybe a future espeak-ng version installs it.
            UCD_LIB=$(find "$ESPEAK_NG_ANDROID_ROOT" -name 'libucd.a' \
              2>/dev/null | head -1)
          fi
          echo "ESPEAK_INC=$ESPEAK_INC"
          echo "ESPEAK_LIB=$ESPEAK_LIB"
          echo "UCD_LIB=$UCD_LIB"
          if [ -z "$ESPEAK_INC" ] || [ -z "$ESPEAK_LIB" ] || [ -z "$UCD_LIB" ]; then
            echo "::error::espeak-ng cross-build artefacts incomplete — kokoro will be broken on Android (espeak-ng=$ESPEAK_LIB, ucd=$UCD_LIB)" >&2
            exit 1
          fi
          # Stash UCD_LIB for the link step below.
          echo "UCD_LIB=$UCD_LIB" >> $GITHUB_ENV
          cmake -S . -B build-android/arm64-v8a \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_TC" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_NATIVE_API_LEVEL=24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCRISPASR_BUILD_EXAMPLES=OFF \
            -DCRISPASR_BUILD_TESTS=OFF \
            -DCRISPASR_OPUS_FETCH=ON \
            -DESPEAK_NG_INCLUDE_DIR="$ESPEAK_INC" \
            -DESPEAK_NG_LIBRARY="$ESPEAK_LIB"
          cmake --build build-android/arm64-v8a --parallel
          # Re-link all static archives into a single shared lib.
          # CMake's OpenMP detection (-- Found OpenMP_CXX: -fopenmp=libomp)
          # compiles ggml/whisper TUs with __kmpc_* calls, but this manual
          # linker invocation doesn't pull in libomp by default. Adding
          # -fopenmp -static-openmp pulls the NDK's libomp.a in and resolves
          # those symbols inside libcrispasr.so — otherwise the runtime
          # dies at dlopen with "cannot locate symbol __kmpc_global_thread_num"
          # (a recurrence of #3 the v0.6.5 build hit).
          cd build-android/arm64-v8a
          NDK_CC=$(find $ANDROID_NDK_HOME/toolchains/llvm/prebuilt -name "aarch64-linux-android24-clang++" | head -1)
          # Pull in the cross-compiled libespeak-ng.a too — without
          # --whole-archive on it, only the espeak_* symbols kokoro
          # actually references get linked, which is what we want
          # (espeak's own data tables live in espeak-ng-data/ at
          # runtime, not in the .a).
          $NDK_CC -shared -o src/libcrispasr.so \
            -fopenmp -static-openmp \
            -Wl,--whole-archive \
            src/libcrispasr.a \
            $(find . -name "lib*.a" ! -name "libcrispasr.a" ! -name "libCatch*" ! -name "libcommon*" -printf "%p ") \
            -Wl,--no-whole-archive \
            "$ESPEAK_NG_ANDROID_ROOT"/lib*/libespeak-ng.a \
            "$UCD_LIB" \
            -lm -llog -lmediandk
          ln -sf libcrispasr.so src/libwhisper.so
          ls -lh src/libcrispasr.so
          # Fail fast if any OpenMP runtime symbol is still UND — silent
          # regression here is exactly how #3 keeps coming back.
          NDKRE=$(find $ANDROID_NDK_HOME/toolchains/llvm/prebuilt -name "llvm-readelf" | head -1)
          if "$NDKRE" --dyn-symbols src/libcrispasr.so \
              | awk '$5=="UND"' | grep -qE "__kmpc|^.* omp_"; then
            echo "::error::libcrispasr.so still has UND OpenMP symbols" >&2
            "$NDKRE" --dyn-symbols src/libcrispasr.so \
              | awk '$5=="UND"' | grep -E "__kmpc|omp_" >&2
            exit 1
          fi
          # Same fail-fast guard for the ucd_* symbols libespeak-ng pulls
          # in — without libucd.a in the link line, dlopen silently fails
          # at runtime and we see "Available backends: {}" + kokoro
          # session_open throwing "cannot locate symbol ucd_isalpha"
          # (#6 v0.6.13 regression).
          if "$NDKRE" --dyn-symbols src/libcrispasr.so \
              | awk '$5=="UND"' | grep -qE "\\bucd_"; then
            echo "::error::libcrispasr.so still has UND ucd_* symbols — libucd.a missing from link" >&2
            "$NDKRE" --dyn-symbols src/libcrispasr.so \
              | awk '$5=="UND"' | grep -E "\\bucd_" >&2
            exit 1
          fi
          # Opus decode capability guard (#26) — libopus/opusfile must be
          # statically linked so .opus files decode natively on Android
          # (no ffmpeg on device). Without these symbols, opus decode
          # silently falls through to the "unsupported format" error.
          SYMS=$("$NDKRE" --dyn-symbols src/libcrispasr.so)
          OPUS_OK=true
          for sym in opus_decode_float opus_decoder_create op_open_file ma_libopus_init_file; do
            if ! echo "$SYMS" | grep -q "$sym"; then
              echo "::error::libcrispasr.so missing opus symbol: $sym (CRISPASR_OPUS_FETCH=ON not effective?)" >&2
              OPUS_OK=false
            fi
          done
          if [ "$OPUS_OK" = false ]; then exit 1; fi
          echo "✓ opus symbols present"
          # Core C API sanity — verify the public entry points exist.
          # Catches link-order bugs where --whole-archive missed a TU.
          for sym in crispasr_audio_load whisper_full whisper_init_from_file_with_params; do
            if ! echo "$SYMS" | grep -q "$sym"; then
              echo "::error::libcrispasr.so missing core symbol: $sym" >&2
              exit 1
            fi
          done
          echo "✓ core API symbols present"

      - name: Copy native lib into jniLibs/
        working-directory: repos/CrisperWeaver
        run: |
          DEST=android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$DEST"
          cp ../CrispASR/build-android/arm64-v8a/src/libcrispasr.so "$DEST/libwhisper.so"
          cp "$DEST/libwhisper.so" "$DEST/libcrispasr.so"
          # libcrispasr.so is C++ and NEEDs libc++_shared.so — without it
          # the Android loader silently fails DynamicLibrary.open and the
          # Dart side falls back to availableBackends()=[], yielding the
          # "bundled libwhisper was built with {}" error from issue #3.
          # The NDK ships it under aarch64-linux-android (NOT "arm64", a
          # filter mismatch that ate the v0.6.4 APK).
          CPPSHARED=$(find "$ANDROID_NDK_HOME" -path "*aarch64-linux-android*" \
            -name "libc++_shared.so" 2>/dev/null | head -1)
          if [ -z "$CPPSHARED" ]; then
            echo "::error::libc++_shared.so not found under \$ANDROID_NDK_HOME" >&2
            exit 1
          fi
          cp "$CPPSHARED" "$DEST/"
          ls -lh "$DEST/"
          # Sanity: confirm every NEEDED dep of libcrispasr.so has a sibling
          # in jniLibs/. Anything missing here = silent dlopen failure at
          # runtime, which is exactly how issue #3 manifested.
          NEEDED=$(${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf \
            -d "$DEST/libcrispasr.so" | awk -F'[][]' '/\(NEEDED\)/{print $2}')
          echo "libcrispasr.so NEEDS: $NEEDED"
          for n in $NEEDED; do
            case "$n" in
              libm.so|libc.so|libdl.so|liblog.so|libmediandk.so) ;;  # provided by Android
              *) [ -f "$DEST/$n" ] || { echo "::error::missing NEEDED dep $n" >&2; exit 1; } ;;
            esac
          done

      - name: Stage espeak-ng-data as Flutter asset
        working-directory: repos/CrisperWeaver
        # Android can't dlopen a directory of phoneme tables — and
        # Flutter's pubspec `assets:` directive doesn't bundle
        # subdirectories recursively. Ship the entire tree as one
        # `espeak-ng-data.tar.gz` asset; EspeakDataService extracts it
        # to the app's docs dir on first launch and sets
        # CRISPASR_ESPEAK_DATA_PATH there before the first kokoro
        # session opens. A single asset avoids enumerating every
        # `lang/<family>/` + `voices/!v/` subdir in pubspec.yaml.
        run: |
          set -x
          NATIVE_DATA="$ESPEAK_NG_NATIVE_ROOT/share/espeak-ng-data"
          if [ ! -d "$NATIVE_DATA" ]; then
            NATIVE_DATA=$(find "$ESPEAK_NG_NATIVE_ROOT" -maxdepth 4 -type d -name 'espeak-ng-data' | head -1)
          fi
          if [ -z "$NATIVE_DATA" ] || [ ! -d "$NATIVE_DATA" ]; then
            echo "::error::espeak-ng-data dir not produced by the native build" >&2
            ls -la "$ESPEAK_NG_NATIVE_ROOT" || true
            ls -la "$ESPEAK_NG_NATIVE_ROOT/share" || true
            exit 1
          fi
          # Fail fast if the data target didn't run — phontab + phondata +
          # phonindex are what libespeak-ng actually loads at init.
          for required in phontab phondata phonindex; do
            if [ ! -f "$NATIVE_DATA/$required" ]; then
              echo "::error::espeak-ng-data missing compiled file: $required (data target didn't run)" >&2
              ls "$NATIVE_DATA" | head -20 >&2
              exit 1
            fi
          done
          # Strip the per-file asset bundle, repack as one tarball.
          rm -rf assets/espeak-ng-data
          mkdir -p assets
          tar -C "$NATIVE_DATA" -czf assets/espeak-ng-data.tar.gz .
          ls -lh assets/espeak-ng-data.tar.gz
          NFILES=$(tar -tzf assets/espeak-ng-data.tar.gz | wc -l | tr -d ' ')
          echo "espeak-ng-data tarball: $NFILES entries"
          if [ "$NFILES" -lt 100 ]; then
            echo "::error::espeak-ng-data tarball suspiciously small ($NFILES entries)" >&2
            exit 1
          fi

      - name: Pub get
        working-directory: repos/CrisperWeaver
        run: flutter pub get

      - name: Generate build info (git hash + timestamp)
        working-directory: repos/CrisperWeaver
        run: bash scripts/gen_build_info.sh

      - name: Refresh baked models catalogue
        working-directory: repos/CrisperWeaver
        # Re-bake `lib/services/baked_models_catalog.dart` from the live
        # HF API so every release ships with a current snapshot — without
        # this the Models screen would either wait on the live probe at
        # first launch OR show stale catalog entries. ~30 s + 30 HTTP
        # requests; failures don't gate the build (the committed snapshot
        # is the floor).
        run: timeout 120 dart run scripts/bake_models_catalog.dart || true

      - name: Build APK (release, unsigned)
        working-directory: repos/CrisperWeaver
        run: flutter build apk --release --target-platform=android-arm64

      - name: Rename APK
        working-directory: repos/CrisperWeaver
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             crisper_weaver-android-arm64.apk
          sha256sum crisper_weaver-android-arm64.apk | tee crisper_weaver-android-arm64.apk.sha256

      - name: Upload APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            repos/CrisperWeaver/crisper_weaver-android-arm64.apk
            repos/CrisperWeaver/crisper_weaver-android-arm64.apk.sha256
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

  # Unsigned iOS IPA — sideload-compatible (AltStore / SideStore / Feather).
  # End-users re-sign with their own free Apple ID (7-day renewal); developers
  # with a paid Apple Developer Program can re-sign for 1-year installs.
  # This job is marked continue-on-error since the iOS build path isn't yet
  # verified end-to-end (first release in which we attempt it).
  build-ios:
    name: iOS IPA (unsigned, sideload-ready)
    # macos-26 ships Xcode 26 (iOS 26.1 SDK). device_info_plus 13.1.0 calls
    # -[NSProcessInfo isiOSAppOnVision] under @available(iOS 26.1) — it needs
    # the 26.1 SDK to *compile* (the selector is undeclared on macos-latest's
    # Xcode 16.4 / iOS 18.5 SDK), which broke the v0.7.7 iOS build.
    runs-on: macos-26
    permissions:
      contents: write
    continue-on-error: true
    steps:
      - name: Check out CrisperWeaver
        uses: actions/checkout@v5
        with:
          path: repos/CrisperWeaver
          ref: ${{ inputs.tag || github.ref }}

      - name: Check out sibling CrispASR
        uses: actions/checkout@v5
        with:
          repository: ${{ env.CRISPASR_REPO }}
          ref: ${{ env.CRISPASR_REF }}
          path: repos/CrispASR
          submodules: recursive

      - name: Check out sibling CrispEmbed
        uses: actions/checkout@v5
        with:
          repository: ${{ env.CRISPEMBED_REPO }}
          ref: ${{ env.CRISPEMBED_REF }}
          path: repos/CrispEmbed
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Build crispasr.xcframework with iOS-only slices (device +
      # simulator, arm64). Without this, the IPA's Runner.app launches
      # but every transcription fails with "no backends" because
      # nothing in ios/ supplies libcrispasr to dart:ffi.
      - name: Build crispasr.xcframework (iOS slim)
        working-directory: repos/CrisperWeaver
        env:
          CRISPASR_DIR: ${{ github.workspace }}/repos/CrispASR
          IOS_MIN_OS_VERSION: "13.0"
        run: bash scripts/build_ios_xcframework.sh

      # Add the xcframework to Runner.xcodeproj as a linked + embedded
      # framework via the xcodeproj Ruby gem (already installed because
      # CocoaPods uses it).
      - name: Wire xcframework into Runner.xcodeproj
        working-directory: repos/CrisperWeaver
        run: |
          gem install xcodeproj --no-document
          ruby scripts/wire_ios_xcframework.rb

      - name: Pub get
        working-directory: repos/CrisperWeaver
        run: flutter pub get

      - name: Generate build info (git hash + timestamp)
        working-directory: repos/CrisperWeaver
        run: bash scripts/gen_build_info.sh

      - name: Refresh baked models catalogue
        working-directory: repos/CrisperWeaver
        # Re-bake `lib/services/baked_models_catalog.dart` from the live
        # HF API so every release ships with a current snapshot — without
        # this the Models screen would either wait on the live probe at
        # first launch OR show stale catalog entries. ~30 s + 30 HTTP
        # requests; failures don't gate the build (the committed snapshot
        # is the floor).
        run: timeout 120 dart run scripts/bake_models_catalog.dart || true

      - name: Build iOS (no codesign — Flutter step)
        working-directory: repos/CrisperWeaver
        run: flutter build ios --release --no-codesign

      # --- App Store signed path (when API key secret is set) ---
      - name: Install signing credentials
        if: ${{ env.APPSTORE_API_KEY_P8 != '' }}
        env:
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$APPSTORE_API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_9RMU3C7422.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_9RMU3C7422.p8
          # Import Distribution cert + private key
          KEYCHAIN="build.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          if [ -n "$IOS_DIST_P12" ]; then
            echo "$IOS_DIST_P12" | base64 -d > /tmp/dist.p12
            security import /tmp/dist.p12 -k "$KEYCHAIN" -P "$IOS_DIST_P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security
            rm /tmp/dist.p12
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning | grep -i "distribution" || echo "WARNING: No Distribution cert"

      - name: Archive (API-key-driven signing)
        if: ${{ env.APPSTORE_API_KEY_P8 != '' }}
        working-directory: repos/CrisperWeaver
        env:
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          PATH="/usr/bin:$PATH" xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_9RMU3C7422.p8 \
            -authenticationKeyID 9RMU3C7422 \
            -authenticationKeyIssuerID 5f618ba3-98ef-42ad-835c-fbbef6c76cf5 \
            archive

      - name: Export signed IPA
        if: ${{ env.APPSTORE_API_KEY_P8 != '' }}
        working-directory: repos/CrisperWeaver
        env:
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          PATH="/usr/bin:$PATH" xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/export \
            -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_9RMU3C7422.p8 \
            -authenticationKeyID 9RMU3C7422 \
            -authenticationKeyIssuerID 5f618ba3-98ef-42ad-835c-fbbef6c76cf5
          cp build/ios/export/Runner.ipa crisper_weaver-ios-appstore.ipa
          shasum -a 256 crisper_weaver-ios-appstore.ipa | tee crisper_weaver-ios-appstore.ipa.sha256

      - name: Validate signed IPA
        if: ${{ env.APPSTORE_API_KEY_P8 != '' }}
        working-directory: repos/CrisperWeaver
        env:
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          xcrun altool --validate-app \
            -f crisper_weaver-ios-appstore.ipa \
            --type ios \
            --api-key 9RMU3C7422 \
            --api-issuer 5f618ba3-98ef-42ad-835c-fbbef6c76cf5

      - name: Upload to App Store Connect
        if: ${{ env.APPSTORE_API_KEY_P8 != '' && env.APPSTORE_APP_ID != '' }}
        working-directory: repos/CrisperWeaver
        env:
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          APPSTORE_APP_ID: ${{ secrets.APPSTORE_APP_ID }}
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | sed 's/version: //' | cut -d+ -f1)
          BUILD=$(grep 'version:' pubspec.yaml | head -1 | sed 's/version: //' | cut -d+ -f2)
          xcrun altool --upload-package crisper_weaver-ios-appstore.ipa \
            --type ios \
            --apple-id "$APPSTORE_APP_ID" \
            --bundle-id com.crispstrobe.crisperweaver \
            --bundle-version "$BUILD" \
            --bundle-short-version-string "$VERSION" \
            --api-key 9RMU3C7422 \
            --api-issuer 5f618ba3-98ef-42ad-835c-fbbef6c76cf5

      # --- Unsigned fallback (when no API key) ---
      - name: Package unsigned IPA (fallback)
        if: ${{ env.APPSTORE_API_KEY_P8 == '' }}
        working-directory: repos/CrisperWeaver
        env:
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr crisper_weaver-ios-unsigned.ipa Payload
          shasum -a 256 crisper_weaver-ios-unsigned.ipa | tee crisper_weaver-ios-unsigned.ipa.sha256

      - name: Upload IPA
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            repos/CrisperWeaver/crisper_weaver-ios-appstore.ipa
            repos/CrisperWeaver/crisper_weaver-ios-appstore.ipa.sha256
            repos/CrisperWeaver/crisper_weaver-ios-unsigned.ipa
            repos/CrisperWeaver/crisper_weaver-ios-unsigned.ipa.sha256
          draft: false
          prerelease: false
          fail_on_unmatched_files: false

  # Windows Flutter desktop build. Uses MSVC 2022 from the runner image,
  # builds CrispASR as shared DLLs (whisper.dll + sibling backend DLLs),
  # bundles them next to runner.exe, and zips the whole Release directory.
  # Marked continue-on-error: the CrispASR shared-library Windows build
  # hasn't been exercised before — upstream CI only tests static libs
  # for their CLI. If whisper.dll fails to produce all its symbols, we
  # learn that here, not during a user install.
  build-windows:
    name: Windows (.zip)
    runs-on: windows-latest
    permissions:
      contents: write
    continue-on-error: true
    steps:
      - name: Check out CrisperWeaver
        uses: actions/checkout@v5
        with:
          path: repos/CrisperWeaver
          ref: ${{ inputs.tag || github.ref }}

      - name: Check out sibling CrispASR
        uses: actions/checkout@v5
        with:
          repository: ${{ env.CRISPASR_REPO }}
          ref: ${{ env.CRISPASR_REF }}
          path: repos/CrispASR
          submodules: recursive

      - name: Check out sibling CrispEmbed
        uses: actions/checkout@v5
        with:
          repository: ${{ env.CRISPEMBED_REPO }}
          ref: ${{ env.CRISPEMBED_REF }}
          path: repos/CrispEmbed
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build espeak-ng from source (kokoro phonemizer)
        shell: pwsh
        # The official Chocolatey MSI ships libespeak-ng.dll +
        # espeak-ng.exe + espeak-ng-data but NOT the import library
        # (libespeak-ng.lib) or headers — both required to link
        # CRISPASR_HAVE_ESPEAK_NG=1 at build time. Without them
        # CrispASR falls back to popen("espeak-ng"), which fails on
        # Windows because cmd.exe doesn't honour the Unix
        # single-quote escaping in the kokoro popen invocation.
        # Build from the 1.52.0 source tag so we get DLL + LIB +
        # headers + data dir straight out of the same CMake project.
        env:
          # Same master pin as the Android cross-build — keeps the
          # source ref consistent across platforms and lets us share
          # any future espeak-ng fixes uniformly.
          ESPEAK_NG_REF: "master"
        run: |
          git clone --depth=1 --branch $env:ESPEAK_NG_REF `
            https://github.com/espeak-ng/espeak-ng.git espeak-ng-src
          cd espeak-ng-src
          cmake -B build `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=ON `
            -DUSE_ASYNC=OFF -DUSE_MBROLA=OFF -DUSE_KLATT=OFF `
            -DUSE_LIBPCAUDIO=OFF -DUSE_LIBSONIC=OFF `
            -DESPEAK_COMPAT=OFF `
            -DENABLE_TESTS=OFF `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE\espeak-ng-win"
          cmake --build build --config Release --target espeak-ng-bin
          cmake --build build --config Release
          cmake --install build --config Release
          $root = "$env:GITHUB_WORKSPACE\espeak-ng-win"
          if (-not (Test-Path $root)) {
            Write-Error "espeak-ng install dir missing after build"
            exit 1
          }
          echo "ESPEAK_NG_ROOT=$root" >> $env:GITHUB_ENV
          Write-Host "espeak-ng install layout:"
          Get-ChildItem $root | Format-Table Name
          Get-ChildItem $root -Recurse -Include "*.dll", "*.lib", "speak_lib.h" |
            ForEach-Object { Write-Host "  $($_.FullName)" }

      - name: Build whisper.dll (shared, Release)
        working-directory: repos/CrispASR
        shell: pwsh
        # Pass ESPEAK_NG_INCLUDE_DIR + ESPEAK_NG_LIBRARY explicitly so
        # CRISPASR_HAVE_ESPEAK_NG=1 gets set + the import library
        # links into whisper.dll. The CMake `cmake --install` layout
        # from the source-built espeak-ng puts the .lib under lib\
        # and headers under include\. Without this, the manual MSI
        # install path silently falls back to popen which is broken on
        # Windows (cmd.exe doesn't honour the Unix single-quote
        # escaping in the kokoro popen invocation) — that's issue #6.
        run: |
          $espeakRoot = $env:ESPEAK_NG_ROOT
          $espeakInc  = Join-Path $espeakRoot "include"
          $espeakLib  = ""
          foreach ($cand in @(
              "$espeakRoot\lib\libespeak-ng.lib",
              "$espeakRoot\lib\espeak-ng.lib",
              "$espeakRoot\libespeak-ng.lib")) {
            if (Test-Path $cand) { $espeakLib = $cand; break }
          }
          if (-not $espeakLib) {
            Get-ChildItem -Recurse -Path $espeakRoot -Filter "*espeak-ng*.lib" |
              ForEach-Object { if (-not $espeakLib) { $espeakLib = $_.FullName } }
          }
          Write-Host "ESPEAK_NG_INCLUDE_DIR=$espeakInc"
          Write-Host "ESPEAK_NG_LIBRARY=$espeakLib"
          if (-not ($espeakLib -and (Test-Path "$espeakInc\espeak-ng\speak_lib.h"))) {
            Write-Error "espeak-ng dev files missing (.lib=$espeakLib, header=$espeakInc\espeak-ng\speak_lib.h)"
            exit 1
          }
          # Patch POSIX popen/pclose → MSVC _popen/_pclose in any
          # CrispASR source that uses them (zonos_tts.cpp today).
          # Upstream fix pending; this keeps the Windows build green.
          Get-ChildItem src -Recurse -Filter *.cpp |
            Where-Object { (Get-Content $_.FullName -Raw) -match '\bpopen\b' } |
            ForEach-Object {
              $content = Get-Content $_.FullName -Raw
              if ($content -notmatch '#define popen _popen') {
                $patch = "#ifdef _MSC_VER`n#define popen _popen`n#define pclose _pclose`n#endif`n"
                Set-Content $_.FullName ($patch + $content)
                Write-Host "  patched $($_.Name) with popen→_popen compat"
              }
            }
          # GGML_NATIVE=OFF disables build-host CPU detection so the
          # DLL doesn't bake in AVX-512 from the GitHub Actions runner.
          # Explicit AVX2+FMA gives best perf on Zen2+ / Haswell+ while
          # keeping Zen3 and older Intel safe. Fixes #19.
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=ON `
            -DGGML_NATIVE=OFF `
            -DGGML_AVX2=ON `
            -DGGML_AVX=ON `
            -DGGML_FMA=ON `
            -DGGML_F16C=ON `
            -DGGML_AVX512=OFF `
            -DWHISPER_BUILD_EXAMPLES=OFF `
            -DWHISPER_BUILD_TESTS=OFF `
            -DCRISPASR_OPUS_FETCH=ON `
            -DESPEAK_NG_INCLUDE_DIR="$espeakInc" `
            -DESPEAK_NG_LIBRARY="$espeakLib"
          cmake --build build --config Release --parallel --target crispasr-lib
          Get-ChildItem build -Recurse -Filter *.dll | Select-Object FullName, Length

      - name: Enable Windows desktop + pub get
        working-directory: repos/CrisperWeaver
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter pub get

      - name: Generate build info (git hash + timestamp)
        working-directory: repos/CrisperWeaver
        shell: bash
        run: bash scripts/gen_build_info.sh

      - name: Refresh baked models catalogue
        working-directory: repos/CrisperWeaver
        shell: pwsh
        run: timeout 120 dart run scripts/bake_models_catalog.dart || true

      - name: Build Windows (Release)
        working-directory: repos/CrisperWeaver
        shell: pwsh
        run: flutter build windows --release

      - name: Bundle CrispASR DLLs next to runner.exe
        working-directory: repos/CrisperWeaver
        shell: pwsh
        env:
          CRISPASR_DIR: ${{ github.workspace }}\repos\CrispASR
          RUNNER_DIR: build\windows\x64\runner\Release
        run: pwsh ./scripts/bundle_windows_dlls.ps1

      # Package the same Release/ directory into an MSIX. Windows
      # learns the audio + subtitle file associations from the
      # msix_config block in pubspec.yaml; the argv intake in
      # main.dart handles the receive side. Unsigned for v1 —
      # SmartScreen complains, README documents the trust-once
      # sideload flow.
      - name: Build MSIX
        working-directory: repos/CrisperWeaver
        shell: pwsh
        # msix 3.16.13 dropped the --verbose flag (the CLI parser hard-
        # errors with `Could not find an option named "--verbose"`),
        # which broke every Windows release since v0.6.5. Just don't
        # pass it — msix:create logs enough at the default level.
        run: |
          flutter pub run msix:create
          $msix = Get-ChildItem -Recurse build\windows\x64\runner\Release -Filter *.msix | Select-Object -First 1
          if (-not $msix) { Write-Error 'msix:create produced no .msix'; exit 1 }
          $dst = "crisper_weaver-windows-x64.msix"
          Copy-Item $msix.FullName $dst
          (Get-FileHash $dst -Algorithm SHA256).Hash | Tee-Object -FilePath "${dst}.sha256"

      - name: Zip release dir
        working-directory: repos/CrisperWeaver/build/windows/x64/runner
        shell: pwsh
        run: |
          Rename-Item Release crisper_weaver
          Compress-Archive -Path crisper_weaver -DestinationPath crisper_weaver-windows-x64.zip -CompressionLevel Optimal
          (Get-FileHash crisper_weaver-windows-x64.zip -Algorithm SHA256).Hash | Tee-Object -FilePath crisper_weaver-windows-x64.zip.sha256

      - name: Upload Windows zip + MSIX
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            repos/CrisperWeaver/build/windows/x64/runner/crisper_weaver-windows-x64.zip
            repos/CrisperWeaver/build/windows/x64/runner/crisper_weaver-windows-x64.zip.sha256
            repos/CrisperWeaver/crisper_weaver-windows-x64.msix
            repos/CrisperWeaver/crisper_weaver-windows-x64.msix.sha256
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
